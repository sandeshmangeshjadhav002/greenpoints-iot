services:
  # ── Backend (FastAPI) ────────────────────────────────────────────────────
  - type: web
    name: ecoloop-api
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://ecoloop-app.onrender.com

  # ── Frontend (Vite / React static site) ─────────────────────────────────
  - type: web
    name: ecoloop-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: ecoloop-api
          type: web
          property: host
          format: https://{value}
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
